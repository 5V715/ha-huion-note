blueprint:
  name: Huion Note — transcribe pages and run handwritten commands
  description: >-
    When the Huion Note X10 integration saves a page, an AI Task (e.g. Claude via
    the Anthropic integration) turns the handwriting into text and picks out
    commands — lines that start with `#` and a keyword, in English or German.
    Without the `#` a line is always just text:


    `#todo` / `#aufgabe` → to-do list · `#shop` / `#einkauf` → shopping list ·
    `#remind <when>` / `#erinnerung <wann>` → to-do with a due time ·
    `#event <when>` / `#termin <wann>` → calendar · `#send` / `#nachricht` →
    push message.


    Every command except `#send` / `#nachricht` first asks on your phone (✓ / ✗)
    and only runs once you confirm. Leave an entity empty to switch that command
    off. Items and events that already exist are not asked about again when a page
    is re-synced. Full guide with
    examples: https://github.com/5V715/ha-huion-note/tree/main/blueprints/automation/huion_note


    Pages must be saved inside the media folder (the integration's default).
  domain: automation
  source_url: https://github.com/5V715/ha-huion-note/blob/main/blueprints/automation/huion_note/transcribe_page.yaml
  input:
    ai:
      name: AI
      input:
        ai_task_entity:
          name: AI Task entity
          description: >-
            The AI Task that reads the page, e.g. "Claude AI Task" from the
            Anthropic integration. Handwriting needs a strong vision model: in its
            settings, untick "recommended settings" and choose Claude Opus 5.5
            (claude-opus-5-5).
          selector:
            entity:
              filter:
                domain: ai_task
        language:
          name: Language
          description: Language of your handwriting, or "auto".
          default: auto
          selector:
            text:
        extra_instructions:
          name: Extra instructions
          description: >-
            Added to the prompt, e.g. "Names I often write: …".
          default: ""
          selector:
            text:
              multiline: true
    commands:
      name: Commands
      description: Where each command goes. Empty = command off.
      input:
        todo_list:
          name: "#todo / #aufgabe → to-do list"
          default: ""
          selector:
            entity:
              filter:
                domain: todo
        shopping_list:
          name: "#shop / #einkauf → shopping list"
          default: ""
          selector:
            entity:
              filter:
                domain: todo
        reminder_list:
          name: "#remind / #erinnerung → to-do list with due times"
          description: >-
            Must support due times (e.g. a Local To-do list). The companion app can
            remind you of due items.
          default: ""
          selector:
            entity:
              filter:
                domain: todo
        calendar:
          name: "#event / #termin → calendar"
          default: ""
          selector:
            entity:
              filter:
                domain: calendar
        event_duration:
          name: Default event length (minutes)
          description: Used when an #event / #termin line has a start time but no end.
          default: 60
          selector:
            number:
              min: 5
              max: 1440
              unit_of_measurement: min
        message_action:
          name: Phone (notify action)
          description: >-
            The companion-app notify action, e.g. `notify.mobile_app_my_phone`.
            Receives the confirmation questions and `#send` / `#nachricht`
            messages. Required for commands: without it, commands are skipped.
          default: ""
          selector:
            text:
        confirm_timeout:
          name: Confirmation timeout
          description: A command not confirmed within this time is dropped.
          default: 60
          selector:
            number:
              min: 1
              max: 1440
              unit_of_measurement: min
        notification_language:
          name: Language of the confirmation messages
          default: en
          selector:
            select:
              options:
                - label: English
                  value: en
                - label: Deutsch
                  value: de
    output:
      name: Output
      input:
        media_dir:
          name: Media folder
          description: >-
            The folder Home Assistant serves as "My media" (`/media` on Home
            Assistant OS).
          default: /media
          selector:
            text:
        notify:
          name: Show a notification
          description: >-
            A persistent notification with the transcript and what was done.
          default: true
          selector:
            boolean:
        actions:
          name: Additional actions
          description: >-
            Run after each page. Variables: `transcript`, `commands`, `done`,
            `page`, `png`, `svg`, `json`.
          default: []
          selector:
            action:

# parallel: a page waiting for confirmations must not hold up the next page
mode: parallel
max: 10

triggers:
  - trigger: event
    event_type: huion_note_page_saved

conditions:
  # Pages without strokes (dots only) have nothing to read.
  - condition: template
    value_template: "{{ trigger.event.data.strokes | int(0) > 0 }}"

variables:
  media_dir: !input media_dir
  language: !input language
  extra_instructions: !input extra_instructions
  show_notification: !input notify
  todo_list: !input todo_list
  shopping_list: !input shopping_list
  reminder_list: !input reminder_list
  calendar_entity: !input calendar
  event_duration: !input event_duration
  message_action: !input message_action
  confirm_timeout: !input confirm_timeout
  notification_language: !input notification_language
  de: "{{ notification_language == 'de' }}"
  page: "{{ trigger.event.data.page }}"
  png: "{{ trigger.event.data.png }}"
  svg: "{{ trigger.event.data.svg }}"
  json: "{{ trigger.event.data.json }}"
  media_root: "{{ media_dir.rstrip('/') ~ '/' }}"
  media_content_id: >-
    {{ 'media-source://media_source/local/' ~ png[media_root | length:]
       if png.startswith(media_root) else '' }}

actions:
  - if: "{{ media_content_id == '' }}"
    then:
      - action: system_log.write
        data:
          level: warning
          logger: blueprints.huion_note.transcribe_page
          message: >-
            Huion Note page {{ page }} was saved outside the media folder
            ({{ png }}); set the integration's output folder inside {{ media_dir }}.
      - stop: Page is not in the media folder

  - action: ai_task.generate_data
    data:
      task_name: Huion Note page {{ page }}
      entity_id: !input ai_task_entity
      instructions: >-
        The attached image is a page handwritten on a Huion Note X10 smart
        notebook (black ink on white){{ '' if language | lower == 'auto'
        else ', written in ' ~ language }}. It is now
        {{ now().strftime('%A, %Y-%m-%d %H:%M') }}.


        1. transcript: the handwriting exactly as written. Keep line breaks, lists
        and headings; write crossed-out text as ~~text~~ and unreadable words as
        [?]. Describe drawings in one short line in square brackets.


        2. commands: a command is a line that STARTS with "#" directly followed by
        one of the keywords below (any capitalisation). The "#" is mandatory: a
        line without it is NEVER a command, even if it starts with a keyword or
        reads like a task ("todo: call mum", "Einkauf Milch" are plain notes).
        Also ignore "#" words in the middle of a line, crossed-out lines, and
        lines you can't read with confidence. After the keyword comes the time
        (for reminders and events), then the text; a colon or dash in between is
        optional.

        - "#todo" or "#aufgabe" → type todo; text = the task.

        - "#shop" or "#einkauf" → type shopping; one command per item when the
        line lists several (separated by commas, "and" or "und").

        - "#remind <when>" or "#erinnerung <wann>" → type reminder; text = what
        to remember; start = the due date and time.

        - "#event <when>" or "#termin <wann>" → type event; text = the title;
        start (and end, if written) = date and time.

        - "#send" or "#nachricht" → type message; text = the message.


        Dates and times: resolve relative ones ("tomorrow", "morgen", "fri",
        "Fr", "next week") from the current date above, always into the future.
        German-style dates like 12.10. mean day.month. Write start/end as
        "YYYY-MM-DD HH:MM", or "YYYY-MM-DD" when no time is written. Leave them
        out for todo, shopping and message. Keep text in the language it was
        written in.

        {{ extra_instructions }}
      structure:
        transcript:
          description: The handwriting as text.
          required: true
          selector:
            text:
              multiline: true
        commands:
          description: Command lines found on the page, in page order. Empty if none.
          required: true
          selector:
            object:
              multiple: true
              fields:
                type:
                  required: true
                  selector:
                    select:
                      options: [todo, shopping, reminder, event, message]
                text:
                  required: true
                  selector:
                    text:
                start:
                  selector:
                    text:
                end:
                  selector:
                    text:
      attachments:
        - media_content_id: "{{ media_content_id }}"
          media_content_type: image/png
    response_variable: result

  - variables:
      transcript: "{{ result.data.transcript }}"
      commands: "{{ result.data.commands or [] }}"
      done: []
      kinds:
        todo: ["To-do", "Aufgabe"]
        shopping: ["Shopping list", "Einkaufsliste"]
        reminder: ["Reminder", "Erinnerung"]
        event: ["Event", "Termin"]
        message: ["Message", "Nachricht"]

  - repeat:
      for_each: "{{ commands }}"
      sequence:
        - variables:
            cmd: "{{ repeat.item }}"
            text: "{{ (cmd.text | default('')) | trim }}"
            kind: "{{ kinds.get(cmd.type, ['?', '?'])[1 if de else 0] }}"
            when: >-
              {{ (cmd.start | default('')) ~ ((' – ' ~ cmd.end) if cmd.end | default('') else '') }}
            label: "{{ kind ~ ': ' ~ text ~ ((' — ' ~ when) if when else '') }}"
            ask_id: "{{ png.split('/')[-1].rsplit('.', 1)[0] ~ '_' ~ repeat.index }}"
            list_entity: >-
              {{ {'todo': todo_list, 'shopping': shopping_list,
                  'reminder': reminder_list, 'event': calendar_entity}.get(cmd.type, '') }}
            has_time: "{{ ' ' in (cmd.start | default('')) | trim }}"
            start: >-
              {{ as_local(as_datetime(cmd.start)).isoformat()
                 if has_time and as_datetime(cmd.start, none) else '' }}
            start_date: >-
              {{ (cmd.start | default(''))[:10]
                 if not has_time and as_datetime(cmd.start | default(''), none) else '' }}
            state: go

        # --- can it run at all? ---
        - variables:
            state: >-
              {% if text == '' or cmd.type not in kinds %}skip:unreadable
              {% elif message_action == '' %}skip:{{ 'kein Handy eingerichtet' if de else 'no phone set' }}
              {% elif cmd.type != 'message' and list_entity == '' %}skip:{{ 'kein Ziel eingerichtet' if de else 'no target set' }}
              {% elif cmd.type == 'event' and start == '' and start_date == '' %}skip:{{ 'kein Datum erkannt' if de else 'no date found' }}
              {% else %}go{% endif %}

        # --- does it exist already (page re-synced after more writing)? ---
        - if: "{{ state == 'go' and cmd.type in ['todo', 'shopping', 'reminder'] }}"
          then:
            - action: todo.get_items
              target:
                entity_id: "{{ list_entity }}"
              data:
                status: [needs_action, completed]
              response_variable: existing
            - if: >-
                {{ text | lower in (existing[list_entity]['items']
                   | map(attribute='summary') | map('lower') | list) }}
              then:
                - variables:
                    state: exists
        - if: "{{ state == 'go' and cmd.type == 'event' }}"
          then:
            - variables:
                end: >-
                  {% if start == '' %}{{ '' }}
                  {% elif ' ' in (cmd.end | default('')) | trim and as_datetime(cmd.end, none) %}{{ as_local(as_datetime(cmd.end)).isoformat() }}
                  {% else %}{{ (as_datetime(start) + timedelta(minutes=event_duration | int)).isoformat() }}{% endif %}
                window_start: "{{ start if start != '' else start_date ~ 'T00:00:00' }}"
                window_end: >-
                  {{ end if start != ''
                     else (as_datetime(start_date) + timedelta(days=1)).strftime('%Y-%m-%dT00:00:00') }}
            - action: calendar.get_events
              target:
                entity_id: "{{ calendar_entity }}"
              data:
                start_date_time: "{{ window_start }}"
                end_date_time: "{{ window_end }}"
              response_variable: found
            - if: >-
                {{ text | lower in (found[calendar_entity].events
                   | map(attribute='summary') | map('lower') | list) }}
              then:
                - variables:
                    state: exists

        # --- ask on the phone (not for #send: the message is the push) ---
        - if: "{{ state == 'go' and cmd.type != 'message' }}"
          then:
            - action: "{{ message_action }}"
              data:
                title: "{{ 'Huion Note — ausführen?' if de else 'Huion Note — run this?' }}"
                message: "{{ label }}"
                data:
                  tag: "{{ ask_id }}"
                  actions:
                    - action: "{{ ask_id }}_ok"
                      title: "{{ '✓ Ja' if de else '✓ Yes' }}"
                    - action: "{{ ask_id }}_no"
                      title: "{{ '✗ Nein' if de else '✗ No' }}"
            - wait_for_trigger:
                - trigger: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ ask_id }}_ok"
                - trigger: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ ask_id }}_no"
              timeout:
                minutes: "{{ confirm_timeout | int }}"
              continue_on_timeout: true
            - if: "{{ wait.trigger is none }}"
              then:
                - variables:
                    state: timeout
                - action: "{{ message_action }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ ask_id }}"
              else:
                - variables:
                    state: >-
                      {{ 'go' if wait.trigger.event.data.action == ask_id ~ '_ok' else 'declined' }}

        # --- run it ---
        - choose:
            - conditions: "{{ state.startswith('skip:') }}"
              sequence:
                - variables:
                    done: "{{ done + ['⏭ ' ~ label ~ ' (' ~ state[5:] ~ ')'] }}"
            - conditions: "{{ state == 'exists' }}"
              sequence:
                - variables:
                    done: "{{ done + ['↺ ' ~ label ~ (' (schon vorhanden)' if de else ' (already there)')] }}"
            - conditions: "{{ state == 'declined' }}"
              sequence:
                - variables:
                    done: "{{ done + ['✗ ' ~ label ~ (' (abgelehnt)' if de else ' (declined)')] }}"
            - conditions: "{{ state == 'timeout' }}"
              sequence:
                - variables:
                    done: "{{ done + ['✗ ' ~ label ~ (' (nicht bestätigt)' if de else ' (not confirmed)')] }}"
            - conditions: "{{ cmd.type == 'message' }}"
              sequence:
                - action: "{{ message_action }}"
                  data:
                    title: Huion Note
                    message: "{{ text }}"
                - variables:
                    done: "{{ done + ['✉ ' ~ text] }}"
            - conditions: "{{ cmd.type == 'event' }}"
              sequence:
                - if: "{{ start != '' }}"
                  then:
                    - action: calendar.create_event
                      target:
                        entity_id: "{{ calendar_entity }}"
                      data:
                        summary: "{{ text }}"
                        start_date_time: "{{ start }}"
                        end_date_time: "{{ end }}"
                  else:
                    - action: calendar.create_event
                      target:
                        entity_id: "{{ calendar_entity }}"
                      data:
                        summary: "{{ text }}"
                        start_date: "{{ start_date }}"
                        end_date: >-
                          {{ (as_datetime(start_date) + timedelta(days=1)).strftime('%Y-%m-%d') }}
                - variables:
                    done: "{{ done + ['📅 ' ~ label] }}"
          default:
            # todo, shopping, reminder
            - if: "{{ cmd.type == 'reminder' and start != '' }}"
              then:
                - action: todo.add_item
                  target:
                    entity_id: "{{ list_entity }}"
                  data:
                    item: "{{ text }}"
                    due_datetime: "{{ start }}"
              else:
                - if: "{{ cmd.type == 'reminder' and start_date != '' }}"
                  then:
                    - action: todo.add_item
                      target:
                        entity_id: "{{ list_entity }}"
                      data:
                        item: "{{ text }}"
                        due_date: "{{ start_date }}"
                  else:
                    - action: todo.add_item
                      target:
                        entity_id: "{{ list_entity }}"
                      data:
                        item: "{{ text }}"
            - variables:
                done: "{{ done + ['✓ ' ~ label] }}"

  - event: huion_note_page_transcribed
    event_data:
      page: "{{ page }}"
      transcript: "{{ transcript }}"
      commands: "{{ commands }}"
      done: "{{ done }}"
      png: "{{ png }}"
      svg: "{{ svg }}"
      json: "{{ json }}"

  - if: "{{ show_notification }}"
    then:
      - action: persistent_notification.create
        data:
          title: Huion Note — page {{ page }}
          message: >-
            {{ transcript }}{% if done %}


            **{{ 'Befehle' if de else 'Commands' }}**

            {% for line in done %}- {{ line }}
            {% endfor %}{% endif %}
          notification_id: huion_note_{{ png.split('/')[-1] }}

  - choose: []
    default: !input actions
